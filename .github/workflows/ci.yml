name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'eslint.config.js'
      - 'package.json'
      - 'playwright.config.ts'
      - 'prettier.config.cjs'
      - 'tsconfig.json'
      - 'vlt-lock.json'
      - 'vlt.json'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'eslint.config.js'
      - 'package.json'
      - 'playwright.config.ts'
      - 'prettier.config.cjs'
      - 'tsconfig.json'
      - 'vlt-lock.json'
      - 'vlt.json'
      - '!**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Setup vlt
        uses: vltpkg/setup-vlt@33ed82786290f7273cdc1442ab01df5cfdd6d538 # v1
        with:
          vlt-version-file: package.json

      - name: Verify vlt lockfile
        env:
          VLT_REGISTRY: https://registry.vlt.io/erickwendel/npm/
          VLT_TOKEN: ${{ secrets.VLT_TOKEN }}
        run: |
          node -e "const {readFileSync}=require('node:fs'); const lock=JSON.parse(readFileSync('vlt-lock.json')); const mirror='https://registry.vlt.io/erickwendel/npm/'; if (lock.options?.registry!==mirror || lock.options?.registries?.npm!==mirror) throw new Error('Untrusted default registry'); for (const [id,node] of Object.entries(lock.nodes)) { if (!id.startsWith('~npm~') || typeof node[2]!=='string' || !node[2].startsWith('sha512-') || (node[3]!=null && (typeof node[3]!=='string' || !node[3].startsWith(mirror)))) throw new Error('Untrusted registry or missing integrity: '+id); }"
          vlt install --expect-lockfile --lockfile-only
          git diff --exit-code -- vlt-lock.json

      - name: Install dependencies
        env:
          VLT_REGISTRY: https://registry.vlt.io/erickwendel/npm/
          VLT_TOKEN: ${{ secrets.VLT_TOKEN }}
        run: vlt install --expect-lockfile

      - name: Build allowlisted dependency scripts
        run: vlt build '#core-js, #esbuild, #fsevents, #onnxruntime-node, #protobufjs, #sharp'

      - name: Save dependency cache
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          # Reuse only within this run; the next run must revalidate through vlt.
          key: vlt-dependencies-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-node26

  lint:
    name: Lint
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Setup vlt
        uses: vltpkg/setup-vlt@33ed82786290f7273cdc1442ab01df5cfdd6d538 # v1
        with:
          vlt-version-file: package.json

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: vlt-dependencies-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-node26

      - name: Require verified dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Verified dependency cache from the dependencies job is unavailable."
          exit 1

      - name: Lint
        run: vlt run lint

  typecheck:
    name: Typecheck
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Setup vlt
        uses: vltpkg/setup-vlt@33ed82786290f7273cdc1442ab01df5cfdd6d538 # v1
        with:
          vlt-version-file: package.json

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: vlt-dependencies-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-node26

      - name: Require verified dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Verified dependency cache from the dependencies job is unavailable."
          exit 1

      - name: Typecheck
        run: vlt run typecheck

  test:
    name: Unit tests (${{ matrix.label }})
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: landing
            command: vlt run -w apps/landing test
          - label: editor 1/4
            command: vlt run -w apps/editor test -- --shard=1/4
          - label: editor 2/4
            command: vlt run -w apps/editor test -- --shard=2/4
          - label: editor 3/4
            command: vlt run -w apps/editor test -- --shard=3/4
          - label: editor 4/4
            command: vlt run -w apps/editor test -- --shard=4/4
          - label: joystick
            command: vlt run -w apps/joystick test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Setup vlt
        uses: vltpkg/setup-vlt@33ed82786290f7273cdc1442ab01df5cfdd6d538 # v1
        with:
          vlt-version-file: package.json

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: vlt-dependencies-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-node26

      - name: Require verified dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Verified dependency cache from the dependencies job is unavailable."
          exit 1

      - name: Test
        run: ${{ matrix.command }}

  e2e:
    name: Playwright E2E (${{ matrix.label }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: editor 1/3
            script: test:e2e:coverage:editor
            report: editor-shard-1
            raw_path: test-results/editor-shard-1-coverage/**/browser-coverage.json
            shard: 1/3
            output_name: editor-shard-1
            coverage_threshold: '0'
          - label: editor 2/3
            script: test:e2e:coverage:editor
            report: editor-shard-2
            raw_path: test-results/editor-shard-2-coverage/**/browser-coverage.json
            shard: 2/3
            output_name: editor-shard-2
            coverage_threshold: '0'
          - label: editor 3/3
            script: test:e2e:coverage:editor
            report: editor-shard-3
            raw_path: test-results/editor-shard-3-coverage/**/browser-coverage.json
            shard: 3/3
            output_name: editor-shard-3
            coverage_threshold: '0'
          - label: landing
            script: test:e2e:coverage:landing
            report: landing
            raw_path: test-results/landing-coverage/**/browser-coverage.json
            shard: ''
            output_name: ''
            coverage_threshold: ''
          - label: public-deck
            script: test:e2e:coverage:public-deck
            report: public-deck
            raw_path: test-results/public-deck-coverage/**/browser-coverage.json
            shard: ''
            output_name: ''
            coverage_threshold: ''
          - label: webmcp
            script: test:e2e:coverage:webmcp
            report: webmcp
            raw_path: test-results/webmcp-coverage/**/browser-coverage.json
            shard: ''
            output_name: ''
            coverage_threshold: ''
          - label: joystick
            script: test:e2e:coverage:joystick
            report: joystick
            raw_path: test-results/joystick-coverage/**/browser-coverage.json
            shard: ''
            output_name: ''
            coverage_threshold: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Setup vlt
        uses: vltpkg/setup-vlt@33ed82786290f7273cdc1442ab01df5cfdd6d538 # v1
        with:
          vlt-version-file: package.json

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: vlt-dependencies-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-node26

      - name: Require verified dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Verified dependency cache from the dependencies job is unavailable."
          exit 1

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: localstudio-dist
          path: dist

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('vlt-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium system dependencies
        run: vlt run playwright:install-deps:chromium

      - name: Install Playwright Chromium browser
        run: vlt run playwright:install:chromium

      - name: Playwright E2E coverage test
        run: vlt run ${{ matrix.script }}
        env:
          E2E_SERVER: dist
          E2E_COVERAGE_THRESHOLD: ${{ matrix.coverage_threshold }}
          LOCALSTUDIO_E2E_OUTPUT_NAME: ${{ matrix.output_name }}
          LOCALSTUDIO_E2E_SHARD: ${{ matrix.shard }}

      - name: Upload raw Playwright coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-browser-coverage-${{ matrix.report }}
          path: ${{ matrix.raw_path }}
          if-no-files-found: ignore

      - name: Add E2E coverage report to job summary
        if: always()
        run: |
          if [ -f coverage-report/${{ matrix.report }}/coverage-summary.md ]; then
            cat coverage-report/${{ matrix.report }}/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/${{ matrix.report }}/coverage-ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload E2E coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-coverage-report-${{ matrix.report }}
          path: coverage-report
          if-no-files-found: error

  editor-e2e-coverage:
    name: Editor E2E coverage aggregate
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Setup vlt
        uses: vltpkg/setup-vlt@33ed82786290f7273cdc1442ab01df5cfdd6d538 # v1
        with:
          vlt-version-file: package.json

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: vlt-dependencies-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-node26

      - name: Require verified dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Verified dependency cache from the dependencies job is unavailable."
          exit 1

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: localstudio-dist
          path: dist

      - name: Download raw editor Playwright coverage
        uses: actions/download-artifact@v5
        with:
          pattern: playwright-browser-coverage-editor-shard-*
          path: coverage-input/editor
          merge-multiple: false

      - name: Generate aggregate editor E2E coverage report
        run: vlt run test:e2e:coverage:report
        env:
          E2E_COVERAGE_INPUT_DIR: coverage-input/editor
          E2E_COVERAGE_OUTPUT_DIR: coverage-report/editor
          E2E_COVERAGE_REPORT_ONLY: '1'
          E2E_COVERAGE_SCOPE: editor
          E2E_COVERAGE_THRESHOLD: '80'

      - name: Add aggregate editor E2E coverage report to job summary
        if: always()
        run: |
          if [ -f coverage-report/editor/coverage-summary.md ]; then
            cat coverage-report/editor/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/editor/coverage-ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregate editor E2E coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-coverage-report-editor
          path: coverage-report
          if-no-files-found: error

  build:
    name: Build
    needs: dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Setup vlt
        uses: vltpkg/setup-vlt@33ed82786290f7273cdc1442ab01df5cfdd6d538 # v1
        with:
          vlt-version-file: package.json

      - name: Restore dependency cache
        id: dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: vlt-dependencies-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}-node26

      - name: Require verified dependency cache
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Verified dependency cache from the dependencies job is unavailable."
          exit 1

      - name: Build
        run: vlt run build
        env:
          LOCALSTUDIO_BASE_PATH: /

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: localstudio-dist
          path: dist
          if-no-files-found: error

  pages-artifact:
    name: Prepare Pages artifact
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, test, e2e, editor-e2e-coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: localstudio-dist
          path: dist

      - name: Download E2E coverage reports
        uses: actions/download-artifact@v5
        with:
          pattern: e2e-coverage-report-*
          path: coverage-report
          merge-multiple: true

      - name: Add coverage report to job summary
        run: |
          if [ -f coverage-report/editor/coverage-summary.md ]; then
            cat coverage-report/editor/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/editor/coverage-ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage-report/joystick/coverage-summary.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/joystick/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/joystick/coverage-ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage-report/landing/coverage-summary.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/landing/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/landing/coverage-ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage-report/public-deck/coverage-summary.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/public-deck/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/public-deck/coverage-ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f coverage-report/webmcp/coverage-summary.md ]; then
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/webmcp/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-report/webmcp/coverage-ci-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish coverage report with site
        run: mkdir -p dist/coverage && cp -R coverage-report/. dist/coverage/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, e2e, pages-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment_result.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment_attempt_1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment_attempt_1.outcome == 'failure'
        run: sleep 30

      - name: Retry deploy to GitHub Pages
        id: deployment_attempt_2
        if: steps.deployment_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Resolve deployment URL
        id: deployment_result
        if: always()
        run: echo "page_url=${{ steps.deployment_attempt_1.outputs.page_url || steps.deployment_attempt_2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
